[project]
name = "tplink-router-mcp"
version = "0.1.0"
description = "TP-Link router MCP server (Claude Code stdio)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9,<2",
  "tplinkrouterc6u>=5.28.0",
  "python-dotenv>=1.0.0",
]

[project.scripts]
tplink-router-mcp = "tplink_router_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tplink_router_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001", "S110"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.8.0",
]
